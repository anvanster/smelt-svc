[workspace]
resolver = "2"
members = [
    "crates/smelt-core",
    "crates/smelt-validator",
    "crates/smelt-memory",
    "crates/smelt-cli",
    "crates/smelt-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/anvanster/smelt-svc"
authors = ["anvanster"]
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Git
git2 = "0.19"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CodeGraph (from codegraph-monorepo)
codegraph = { path = "../codegraph-monorepo/crates/codegraph" }
codegraph-parser-api = { path = "../codegraph-monorepo/crates/codegraph-parser-api" }

# Internal crates
smelt-core = { path = "crates/smelt-core" }
smelt-validator = { path = "crates/smelt-validator" }
smelt-memory = { path = "crates/smelt-memory" }

# Embeddings
fastembed = "4"

# Async
async-trait = "0.1"

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = true
