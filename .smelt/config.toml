# Smelt Configuration
# See https://github.com/anvanster/smelt-svc for documentation

[codegraph]
storage = "graph"
languages = ["python", "rust", "typescript", "javascript", "go"]

[memory]
storage = "memory"
embeddings_model = "bge-small-en-v1.5"

[git]
auto_stage = true

[validation]
strict = false
