[package]
name = "smelt-mcp"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "MCP (Model Context Protocol) server for Smelt semantic version control"

[[bin]]
name = "smelt-mcp"
path = "src/main.rs"

[dependencies]
# Internal crates
smelt-core = { workspace = true }
smelt-memory = { workspace = true }
smelt-validator = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# DateTime
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
